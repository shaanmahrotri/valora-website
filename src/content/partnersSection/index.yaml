intro: "Valora is Tom Rutherford and Shaan Mahrotri. Two partners, not a firm of many, which is the point: you get senior judgement directly, not a layer of staff beneath it."
closing: "In practice that means time inside the operating systems and investment processes already in place, a seat at the table on advisory committees, support on resourcing decisions, whether that's headcount or the wider technology stack, and a hand in the family's own commercial and corporate activities, not just its office. Where it helps, we work alongside the providers and advisers already in the room, not instead of them. No two family offices need the same network around them, so we don't bring a fixed one."
