tagline: "Embedded, not external. Expertise, not theory. Enterprise, not inertia."
paragraphs:
  - "Fractional isn't a lesser version of permanent. It's a different shape of commitment, built for families who are moving across borders, between generations, or through a transition that a single permanent hire can't flex around. It means specific expertise exactly when it's needed, a wider network than one person could carry alone, and the ability to work alongside the team and advisers you already have rather than replacing them."
  - "Few family offices have the luxury of one problem at a time. Succession, governance, a generational handover already underway, a regulatory shift that lands without warning - it tends to arrive together. The volume is the problem, as much as any single issue inside it."
  - "We work inside the family office, not outside it, for as long as the work requires. No decks handed across, no frameworks left behind for someone else to run. We sit with your team and do the work alongside them, lending expertise rather than adding another voice to manage."
  - "That holds whatever is moving through the landscape at the time. Right now AI is one of the things moving fastest, and we are not an AI practice because of it. We help families decide what to adopt, what to resist and what to govern, whether the subject is succession, structure or, currently, AI."
photo: "/material.jpg"
verdict: "We are not consultants who present, and we are not a permanent hire either. We are trusted because we work the way a family office actually needs us to: embedded, for as long as it takes, and not a day longer."
