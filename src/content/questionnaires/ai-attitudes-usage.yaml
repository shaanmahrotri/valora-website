title: "SFO AI Attitudes & Usage Questionnaire"
intro: "Estimated completion time: roughly 10-11 minutes."
formVersion: 2
submitLabel: "Submit my answers"

gate:
  id: "q0"
  prompt: "Before you begin: would you like the option of a short personalised comparison report once we have enough responses in?"
  yesLabel: "Yes - ask me for my details at the end"
  noLabel: "No thanks, keep me fully anonymous"
  note: "Your responses are collected anonymously unless you opt in above. Any aggregate findings shared with the group are anonymised - no individual response is ever attributed without your consent."

sections:
  - heading: "A. Orientation - How AI Actually Works"
    questions:
      - id: "q1a"
        displayNumber: "Q1"
        type: "scale"
        prompt: "On a scale of 1-5, how would you rate your own overall fluency in how AI actually works?"
        scaleMin: 1
        scaleMax: 5
        scaleMinLabel: "Not at all fluent"
        scaleMaxLabel: "Completely fluent"
      - id: "q1b"
        type: "multi"
        prompt: "Check the box if you can confidently explain each of the following:"
        options:
          - "The difference between a chatbot and an autonomous agent"
          - "Why AI sometimes states things confidently that are wrong"
          - "What happens to data once it's put into an AI tool"
          - "The difference between the AI model itself and the orchestration layer that connects it to your other systems"
          - "None of these - I'd like them all explained"

  - heading: "B. Exposure - Where AI Already Resides Around You"
    questions:
      - id: "q2a"
        displayNumber: "Q2"
        type: "scale"
        prompt: "How confident are you that you know every point at which AI already touches your office - not just tools you've deliberately adopted, but AI embedded in the platforms, banks and advisers around you?"
        scaleMin: 1
        scaleMax: 5
        scaleMinLabel: "Not at all confident"
        scaleMaxLabel: "Completely confident"
      - id: "q2b"
        displayNumber: "Q3"
        type: "single"
        prompt: "Do your providers, banks and advisers tell you, unprompted, how they use AI and how they treat your data?"
        options:
          - "Yes, on both"
          - "Yes, on usage only"
          - "Yes, on treatment"
          - "Sometimes"
          - "No, on neither"
          - "Not sure"
        detailPrompt: "Tell us more (optional)"
        detailShowIfValues:
          - "Yes, on both"
          - "Yes, on usage only"
          - "Yes, on treatment"

  - heading: "C. Internal Tools & Platforms - AI in Your Operating Stack"
    questions:
      - id: "q3"
        displayNumber: "Q4"
        type: "grid"
        prompt: "Thinking about the systems your office actually runs day to day, for each of the following: is AI already embedded in what you use, as far as you know?"
        gridColumns:
          - "Yes"
          - "No"
          - "Not employed/not relevant"
          - "Not sure"
        gridRows:
          - { id: "ledger", label: "General ledger / partnership accounting system" }
          - { id: "aggregation", label: "Aggregation & consolidated reporting platform" }
          - { id: "research", label: "Investment research, manager due-diligence & DDQ tools" }
          - { id: "taxlegal", label: "Tax / legal reference & document-drafting tools" }
          - { id: "payments", label: "Payment processing / treasury and bill-pay platforms" }
          - { id: "fundaccounting", label: "Fund accounting/NAV administration" }
          - { id: "other", label: "Other (please specify)", optional: true }
        gridFollowUpColumn: "Yes"
        gridFollowUpPrompt: "If yes - what functionality has AI added?"
      - id: "q4"
        displayNumber: "Q5"
        type: "single"
        prompt: "Do you know which of your tools sit on a platform you share with other clients of that provider, versus one where your office's data stays in an environment you control?"
        options:
          - "Yes, for all of them"
          - "Yes, for some"
          - "No, I've never thought about it this way"
        detailPrompt: "Has this ever mattered to a decision you've made? (optional)"
      - id: "q5"
        displayNumber: "Q6"
        type: "single"
        prompt: "If a member of your own team were putting sensitive family information into a consumer AI tool - ChatGPT, Claude, Gemini, a personal account, anything outside your controlled systems - right now, would you know?"
        options:
          - "Yes, certainly"
          - "Probably"
          - "Probably not"
          - "No idea"
        detailPrompt: "Anything you'd like to add? (optional)"

  - heading: "D. Agentic Workflows & Internal Efficiency"
    intro: "For context: an \"agentic\" workflow is one where AI does more than answer a question in a chat window - it moves information between systems on your behalf. A working example: a capital call notice arrives; it's read and checked automatically against your records; a summary is prepared for approval; only once a person approves does anything get staged for payment - and release itself still requires a second, separate human step. The shape that matters is automation on the handoffs, humans on the decisions that carry consequence."
    questions:
      - id: "q6"
        displayNumber: "Q7"
        type: "single"
        prompt: "Has your office built or commissioned anything like this - an agentic workflow designed around one of its own processes?"
        options:
          - "Yes, in at least one process"
          - "We've piloted something"
          - "No, but we've discussed it"
          - "No, it's never come up"
        detailPrompt: "Please outline the project built or considered"
        detailShowIfValues:
          - "Yes, in at least one process"
          - "We've piloted something"
          - "No, but we've discussed it"
      - id: "q7"
        displayNumber: "Q8"
        type: "multi"
        prompt: "What's held you back, if anything, from automating more of your internal workflows this way?"
        options:
          - "Cost"
          - "Technical resourcing or expertise"
          - "Trust in the output"
          - "Trust in data security"
          - "Not knowing where to start"
          - "Nothing - we're actively pursuing this"
          - "Other: please specify"
        maxSelections: 2
        detailPrompt: "Tell us more / please specify (optional)"
        showIfQuestionId: "q6"
        showIfValues:
          - "No, but we've discussed it"
          - "No, it's never come up"
      - id: "q8"
        displayNumber: "Q9"
        type: "open"
        prompt: "If one internal process could be meaningfully accelerated this way, without losing the human sign-off, which would you choose?"

  - heading: "E. Family and Next Generation"
    questions:
      - id: "q9"
        displayNumber: "Q10"
        type: "single"
        prompt: "How is the next generation in your family engaging with AI in relation to their own affairs?"
        options:
          - "Not at all, as far as I know"
          - "A little, occasionally"
          - "Regularly"
          - "Extensively"
          - "Not applicable"
        detailPrompt: "Tell us more (optional)"

  - heading: "F. Risk Awareness"
    questions:
      - id: "q10"
        displayNumber: "Q11"
        type: "multi"
        prompt: "Which of these concerns you most for a family office like yours, right now? Select one or two."
        options:
          - "Data leaving the building via AI tools you don't control"
          - "Fraud or impersonation (deepfakes, voice-cloning)"
          - "Decisions made on AI output that later turns out wrong"
          - "Reputational exposure"
          - "Something else: please specify"
        maxSelections: 2
        detailPrompt: "Why? (optional)"
      - id: "q11"
        displayNumber: "Q12"
        type: "single"
        prompt: "Has your office experienced, or come close to, anything you'd now recognise as an AI-related incident - a fabricated figure, a cloned voice, a document that looked right but wasn't?"
        options:
          - "Yes"
          - "No"
          - "Prefer not to say"
        detailPrompt: "A one-line description, if you're comfortable sharing - no need to name names or specifics (optional)"
        detailShowIfValues:
          - "Yes"

  - heading: "G. Governance"
    questions:
      - id: "q12"
        displayNumber: "Q13"
        type: "single"
        prompt: "Does your office have any policy or guardrails, formal or informal, on how AI may be used - including which tools staff may use, and for what?"
        options:
          - "Yes, a formal written policy"
          - "Yes, an informal shared understanding"
          - "No, but it's been discussed"
          - "No, and it hasn't come up"
      - id: "q13"
        displayNumber: "Q14"
        type: "single"
        prompt: "Who, if anyone, is accountable for AI-related decisions and oversight in your office today?"
        options:
          - "Principal"
          - "Single Executive (CEO, CTO, COO)"
          - "Board or committee"
          - "Combination"
          - "Outsourced provider"
          - "No one at present"

  - heading: "H. Operational Impact and Outcomes"
    questions:
      - id: "q14"
        displayNumber: "Q15"
        type: "multi"
        prompt: "Which process(es) has AI improved, or where hasn't it added value despite the effort?"
        options:
          - "Time saved on reporting or admin"
          - "Faster research or due diligence"
          - "Improved data quality or consistency"
          - "Cost reduction"
          - "Tried, but no measurable difference"
          - "Haven't tried"
        detailPrompt: "Where, specifically (optional)"

  - heading: "I. Future Developments"
    questions:
      - id: "q15"
        displayNumber: "Q16"
        type: "single"
        prompt: "Over the next 12 months, is your office's posture toward AI best described as:"
        options:
          - "Actively expanding deliberate use"
          - "Cautiously exploring specific use cases"
          - "Holding roughly steady"
          - "Pulling back and tightening controls"
          - "Yet to decide"
      - id: "q16"
        displayNumber: "Q17"
        type: "single"
        prompt: "Do you see meaningful AI capability as something your office should be prepared to invest in properly, or something that should cost little to nothing?"
        options:
          - "Worth proper investment"
          - "Some investment, but modestly"
          - "Should be low-cost or free"
          - "Haven't thought about it this way"
      - id: "q17"
        displayNumber: "Q18"
        type: "multi"
        prompt: "Looking beyond the next 12 months, which of these do you expect AI and agentic developments to mean for your office, over the longer term?"
        options:
          - "Overall team headcount will shrink"
          - "Existing staff will need to upskill around AI"
          - "IT/technology budgets will increase"
          - "Our investment scope or mandate will broaden"
          - "We will rely less on outside advisers or providers"
          - "None of these / too early to say"
          - "Other: please specify"
        detailPrompt: "Tell us more (optional)"
        detailShowIfValues:
          - "Other: please specify"
      - id: "q18"
        displayNumber: "Q19"
        type: "rankTwo"
        prompt: "Which of these would be most valuable to explore together in a facilitated session? Pick your top two, in order - the first you select is ranked first."
        options:
          - "Data exposure through your advisers and providers"
          - "The tools and platforms your own office runs, and where AI already sits inside them"
          - "Staff and next-generation usage"
          - "Incident response and fraud"
          - "Practical automation and opportunity"
      - id: "q19"
        displayNumber: "Q20"
        type: "open"
        prompt: "What's the one AI-related question about your own family office that you don't currently have a good answer to?"

closing:
  leadText: "As requested - leave your details below and we'll send your personalised comparison once we have enough responses in to make it meaningful."
  fields:
    - "name"
    - "organisation"
    - "email"
  consentNote: "Adding your details links them to the answers you've just given. Your name, family office name and email are used only to send your personalised comparison report, and are stored separately from your survey answers. Any benchmarking data shared back to the group is fully anonymised and no individual response is ever attributed. Your details are not shared with any third party, and you can ask us to delete them at any time by emailing datacontroller@valorapartners.co.uk. Processed under UK GDPR on the basis of the consent given here."
  offerMarketingConsent: true
