title: "Client Discovery Questionnaire"
intro: "A short set of questions to help us understand your family's circumstances and where fractional family office support could help. Nothing here is binding - it simply shapes the conversation we have next."
formVersion: 1
submitLabel: "See my results"
questions:
  - id: "structure-1"
    prompt: "Which best describes your family's current arrangement?"
    options:
      - "Single household, first generation of wealth"
      - "Single household, wealth inherited or transferred"
      - "Multiple related households sharing some structures"
      - "A formal single family office already exists"
  - id: "structure-2"
    prompt: "How many generations are currently involved in financial decisions?"
    options:
      - "One"
      - "Two"
      - "Three or more"
      - "Not yet decided"
  - id: "structure-3"
    prompt: "Is there a family constitution or governance charter in place?"
    options:
      - "Yes, well established"
      - "Yes, but it needs revisiting"
      - "No, but we'd like one"
      - "No, and it's not a priority"
  - id: "advisors-1"
    prompt: "Which advisors do you currently work with?"
    options:
      - "Wealth manager or private bank only"
      - "Accountant and lawyer, no dedicated wealth advisor"
      - "A mix of several unconnected advisors"
      - "No regular advisors at present"
  - id: "advisors-2"
    prompt: "How well do your current advisors coordinate with one another?"
    options:
      - "Very well - regular joint reviews"
      - "Somewhat - they speak occasionally"
      - "Rarely, if ever"
      - "Not applicable"
  - id: "advisors-3"
    prompt: "What's missing most from your current advisory setup?"
    options:
      - "A single point of coordination"
      - "Independent, conflict-free advice"
      - "Long-term strategic planning"
      - "Nothing specific - just exploring options"
  - id: "assets-1"
    prompt: "Which best describes the complexity of your assets?"
    options:
      - "Mostly liquid investments"
      - "A mix of liquid and illiquid (property, private businesses)"
      - "Significant operating businesses alongside investments"
      - "Assets spread across multiple jurisdictions"
  - id: "assets-2"
    prompt: "Do you hold assets in trusts or corporate structures?"
    options:
      - "Yes, several"
      - "Yes, one or two"
      - "No, everything is held personally"
      - "Unsure"
  - id: "assets-3"
    prompt: "How would you describe your appetite for investment risk?"
    options:
      - "Cautious - capital preservation first"
      - "Balanced - steady growth with some risk"
      - "Growth-oriented - comfortable with volatility"
      - "It varies significantly by pot of money"
  - id: "goals-1"
    prompt: "What's the primary goal for the next 5 years?"
    options:
      - "Consolidating and simplifying existing arrangements"
      - "Growing and diversifying wealth"
      - "Preparing for a liquidity event (sale, exit, inheritance)"
      - "Preparing to pass wealth to the next generation"
  - id: "goals-2"
    prompt: "How important is philanthropy or impact investing to your family?"
    options:
      - "Central to how we think about wealth"
      - "Important, but not yet formalised"
      - "Occasional, ad hoc giving"
      - "Not currently a priority"
  - id: "goals-3"
    prompt: "How do you currently think about sustainability in your investments?"
    options:
      - "It's a formal part of our investment policy"
      - "We consider it informally"
      - "We're interested but haven't started"
      - "It's not a current focus"
  - id: "succession-1"
    prompt: "Is there a succession or estate plan in place?"
    options:
      - "Yes, reviewed within the last two years"
      - "Yes, but it's out of date"
      - "No, but we intend to create one"
      - "No, and it hasn't been discussed"
  - id: "succession-2"
    prompt: "How prepared do you feel the next generation is to inherit responsibility?"
    options:
      - "Very prepared - actively involved already"
      - "Somewhat prepared"
      - "Not yet prepared"
      - "Not applicable"
  - id: "succession-3"
    prompt: "Would structured education for the next generation be of interest?"
    options:
      - "Yes, a clear priority"
      - "Possibly, worth exploring"
      - "Not at this stage"
      - "Not applicable"
  - id: "risk-1"
    prompt: "How confident are you in your current level of insurance and risk protection?"
    options:
      - "Very confident"
      - "Reasonably confident"
      - "Not very confident"
      - "Haven't reviewed it recently"
  - id: "risk-2"
    prompt: "How well documented is your family's cybersecurity and privacy posture?"
    options:
      - "Formally documented and maintained"
      - "Some measures in place, informally"
      - "Minimal measures"
      - "Not something we've considered"
  - id: "governance-1"
    prompt: "How are major financial decisions currently made?"
    options:
      - "By one individual"
      - "Jointly between a couple or small group"
      - "Through a formal decision-making process"
      - "It varies by situation"
  - id: "governance-2"
    prompt: "How often does the family meet to discuss finances together?"
    options:
      - "Regularly, on a set schedule"
      - "Occasionally, as issues arise"
      - "Rarely"
      - "Never, to date"
  - id: "engagement-1"
    prompt: "What level of ongoing involvement would suit you best?"
    options:
      - "Fully fractional - support only when needed"
      - "A regular but light-touch cadence"
      - "Close, ongoing involvement"
      - "Not sure yet"
  - id: "engagement-2"
    prompt: "How soon would you like to begin addressing these areas?"
    options:
      - "Immediately"
      - "Within the next 3-6 months"
      - "Within the next year"
      - "Just exploring for now"
  - id: "engagement-3"
    prompt: "How did you hear about Valora?"
    options:
      - "Personal referral"
      - "Professional advisor introduction"
      - "Online or social media"
      - "Other"
  - id: "reporting-1"
    prompt: "How do you currently track your overall wealth across accounts and structures?"
    options:
      - "A single consolidated report"
      - "Several separate reports we combine ourselves"
      - "No consolidated view at present"
      - "Not sure - it's handled by someone else"
  - id: "reporting-2"
    prompt: "How useful would a single consolidated family reporting dashboard be?"
    options:
      - "Essential"
      - "Very useful"
      - "Nice to have"
      - "Not necessary"
