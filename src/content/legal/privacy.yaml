title: Privacy Policy
lastUpdated: 23 June 2026
sections:
- heading: Who we are
  paragraphs:
  - 'LOTUC Consulting Ltd, trading as Valora Partners<br>

    Registered in England and Wales, company number 11215783<br>

    Registered office: 71-75 Shelton Street, London, WC2H 9JQ<br>

    Contact: <a href="mailto:privacy@valorapartners.co.uk" class="legal__link">privacy@valorapartners.co.uk</a>'
  - We are the data controller for the purposes of UK GDPR.
- heading: What data we collect
  paragraphs:
  - This website does not currently use contact forms, account registration or analytics tracking. We do not collect personal data through the website at this time.
  - If you contact us directly by email, we will hold your name and email address for the purpose of responding to your enquiry. We will not use this information for any other purpose or share it with third parties without your consent.
- heading: Cookies
  paragraphs:
  - We use strictly necessary cookies only. See our <a href="/cookies" class="legal__link">Cookie Policy</a> for details.
- heading: Your rights
  paragraphs:
  - Under UK GDPR you have the right to access, correct or request deletion of any personal data we hold about you. To exercise any of these rights, contact us at <a href="mailto:privacy@valorapartners.co.uk" class="legal__link">privacy@valorapartners.co.uk</a>.
- heading: Changes to this policy
  paragraphs:
  - We may update this policy from time to time. The date at the top of this page reflects the most recent revision.
- heading: Complaints
  paragraphs:
  - If you are unhappy with how we handle your data, you have the right to complain to the Information Commissioner's Office at <a href="https://ico.org.uk" class="legal__link" target="_blank" rel="noopener">ico.org.uk</a>.
