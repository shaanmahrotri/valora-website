title: Privacy Policy
lastUpdated: 6 July 2026
sections:
- heading: Who we are
  paragraphs:
  - 'LOTUC Consulting Ltd, trading as Valora Partners<br>

    Registered in England and Wales, company number 11215783<br>

    Registered office: 71-75 Shelton Street, London, WC2H 9JQ<br>

    Contact: <a href="mailto:privacy@valorapartners.co.uk" class="legal__link">privacy@valorapartners.co.uk</a>'
  - We are the data controller for the purposes of UK GDPR.
- heading: What data we collect
  paragraphs:
  - If you contact us directly by email, we will hold your name and email address for the purpose of responding to your enquiry. We will not use this information for any other purpose or share it with third parties without your consent.
  - 'From time to time we may make private client questionnaires or surveys available by direct link. Your answers are collected regardless of whether you provide any contact details. If you choose to enter your name and email address, this is entirely optional and is only used for the purpose(s) you separately tick: (a) sending you a copy of your results, and/or (b) contacting you about our services. These are kept as two distinct choices - ticking one does not opt you into the other, and both are unticked by default.'
  - Where you ask to be contacted about our services, we send a confirmation email and only treat that consent as active once you have clicked to confirm it. Every marketing email includes a one-click unsubscribe link, or you can withdraw either form of consent at any time by contacting us at <a href="mailto:privacy@valorapartners.co.uk" class="legal__link">privacy@valorapartners.co.uk</a>.
  - 'Questionnaire data is processed on our behalf by two data processors acting under our instructions: Supabase (database hosting, EU region) and Resend (transactional email delivery). Neither uses your data for their own purposes.'
  - We keep questionnaire data for as long as necessary for the purposes described above, and review what we hold periodically. You can ask us to access, correct or delete it at any time using the contact details above.
- heading: Cookies
  paragraphs:
  - We use strictly necessary cookies only. See our <a href="/cookies" class="legal__link">Cookie Policy</a> for details.
- heading: Your rights
  paragraphs:
  - Under UK GDPR you have the right to access, correct or request deletion of any personal data we hold about you. To exercise any of these rights, contact us at <a href="mailto:privacy@valorapartners.co.uk" class="legal__link">privacy@valorapartners.co.uk</a>.
- heading: Changes to this policy
  paragraphs:
  - We may update this policy from time to time. The date at the top of this page reflects the most recent revision.
- heading: Complaints
  paragraphs:
  - If you are unhappy with how we handle your data, you have the right to complain to the Information Commissioner's Office at <a href="https://ico.org.uk" class="legal__link" target="_blank" rel="noopener">ico.org.uk</a>.
