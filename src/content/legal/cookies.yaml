title: Cookie Policy
lastUpdated: 23 June 2026
sections:
- heading: What are cookies
  paragraphs:
  - Cookies are small text files placed on your device by a website. They are widely used to make websites function correctly and to provide information to website owners.
- heading: Cookies we use
  paragraphs:
  - This website currently uses strictly necessary cookies only. These are cookies required for the website to function and cannot be switched off. They do not track you across other sites and do not store any personally identifiable information.
  - We do not currently use analytics, advertising or tracking cookies.
- heading: Managing cookies
  paragraphs:
  - You can set your browser to block or alert you to all cookies. If you block strictly necessary cookies, parts of the site may not work as intended. Most browsers include cookie controls in their settings or privacy menus.
  - For more information about cookies and how to manage them, visit <a href="https://ico.org.uk/for-the-public/online/cookies" class="legal__link" target="_blank" rel="noopener">ico.org.uk/for-the-public/online/cookies</a>.
- heading: Changes to this policy
  paragraphs:
  - If we introduce analytics or other non-essential cookies in future, we will update this policy and present a consent banner before placing those cookies on your device.
