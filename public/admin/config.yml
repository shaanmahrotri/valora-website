# Local editing: run `npx decap-server` in a second terminal alongside
# `npm run dev`, then open http://localhost:4321/admin.
#
# For the eventual hosted setup ("Stage B" in CLAUDE.md), swap `backend` to:
#   backend:
#     name: github
#     repo: shaanmahrotri/valora-website
#     branch: astro-rebuild
# Needs a GitHub OAuth App (callback https://api.netlify.com/auth/done)
# registered with Netlify first (Project configuration > Access & security
# > OAuth > Install Provider > GitHub) - Netlify then facilitates the OAuth
# handshake automatically, no server of our own needed. Each editor needs
# their own GitHub account with Write access on this repo. Not git-gateway
# - that backend is Netlify-deprecated; see CLAUDE.md roadmap for why.
backend:
  name: proxy
  proxy_url: http://localhost:8081/api/v1
  branch: astro-rebuild

media_folder: public
public_folder: /

collections:
  - name: pages
    label: Homepage sections
    files:
      - name: hero
        label: Hero
        file: src/content/hero/index.yaml
        fields:
          - { name: kicker, label: Kicker, widget: string }
          - { name: headline, label: "Headline (h1)", widget: text }
          - name: bodyParagraphs
            label: Body paragraphs
            widget: list
            field: { name: paragraph, label: Paragraph, widget: text }
          - { name: maxim, label: "Maxim line", widget: string }
          - { name: photo, label: "Lead photo path", widget: string }

      - name: approach
        label: Approach
        file: src/content/approach/index.yaml
        fields:
          - { name: tagline, label: "Tagline / statement", widget: text }
          - name: paragraphs
            label: Flowing paragraphs
            widget: list
            field: { name: paragraph, label: Paragraph, widget: text }
          - { name: photo, label: "Photo path", widget: string }
          - { name: verdict, label: "Verdict line", widget: text }

      - name: contact
        label: Contact
        file: src/content/contact/index.yaml
        fields:
          - { name: lead, label: "Lead paragraph", widget: text }

      - name: settings
        label: "Site settings"
        file: src/content/settings/index.yaml
        fields:
          - { name: insightsEnabled, label: "Insights section enabled (uncheck to take the whole section offline - nav, homepage block and all article pages - while you're still working on it)", widget: boolean, default: true }

      - name: partnersSection
        label: "Partners section copy"
        file: src/content/partnersSection/index.yaml
        fields:
          - { name: intro, label: "Intro (before the bios)", widget: text }
          - { name: closing, label: "Closing - What we bring (after the bios)", widget: text }

  - name: partners
    label: Partners
    folder: src/content/partners
    extension: yaml
    format: yaml
    create: true
    slug: "{{slug}}"
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role, widget: string }
      - { name: photo, label: "Photo path", widget: string }
      - { name: email, label: Email, widget: string }
      - name: bio
        label: Bio paragraphs
        widget: list
        field: { name: paragraph, label: Paragraph, widget: text }

  - name: legal
    label: "Legal pages"
    files:
      - name: privacy
        label: "Privacy Policy"
        file: src/content/legal/privacy.yaml
        fields: &legal_fields
          - { name: title, label: Title, widget: string }
          - { name: lastUpdated, label: "Last updated (shown on the page)", widget: string }
          - name: sections
            label: Sections
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - { name: heading, label: Heading, widget: string }
              - name: paragraphs
                label: Paragraphs
                widget: list
                field: { name: paragraph, label: "Paragraph (HTML allowed, e.g. an <a href=\"...\">link</a> or <br> line break)", widget: text }

      - name: cookies
        label: "Cookie Policy"
        file: src/content/legal/cookies.yaml
        fields: *legal_fields

      - name: terms
        label: "Terms of Use"
        file: src/content/legal/terms.yaml
        fields: *legal_fields

      - name: disclaimer
        label: "Disclaimer"
        file: src/content/legal/disclaimer.yaml
        fields: *legal_fields

  - name: questionnaires
    label: "Questionnaires"
    folder: src/content/questionnaires
    extension: yaml
    format: yaml
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: intro, label: "Intro copy", widget: text }
      - { name: formVersion, label: "Form version (bump when questions change meaningfully)", widget: number, value_type: int, default: 1 }
      - { name: submitLabel, label: "Submit button label", widget: string, default: "See my results" }
      - name: gate
        label: "Opt-in gate (optional - asked first; answering \"no\" skips the closing contact step entirely)"
        widget: object
        required: false
        fields:
          - { name: id, label: "Question id (must stay unique)", widget: string }
          - { name: prompt, label: Question, widget: text }
          - { name: yesLabel, label: "\"Yes\" option label", widget: string }
          - { name: noLabel, label: "\"No\" option label", widget: string }
          - { name: note, label: "Small print shown under the options", widget: text, required: false }
      - name: sections
        label: Sections
        widget: list
        summary: "{{fields.heading}}"
        fields:
          - { name: heading, label: "Section heading", widget: string, required: false }
          - { name: intro, label: "Section intro copy (shown above its first question)", widget: text, required: false }
          - name: questions
            label: Questions
            widget: list
            summary: "{{fields.id}} - {{fields.prompt}}"
            fields:
              - { name: id, label: "Question id (must stay unique across the whole questionnaire)", widget: string }
              - name: type
                label: "Question type"
                widget: select
                options: ["scale", "single", "multi", "rankTwo", "grid", "open"]
              - { name: prompt, label: Question, widget: text }
              - { name: scaleMin, label: "[scale] Min value", widget: number, value_type: int, required: false, default: 1 }
              - { name: scaleMax, label: "[scale] Max value", widget: number, value_type: int, required: false, default: 5 }
              - { name: scaleMinLabel, label: "[scale] Label for the low end", widget: string, required: false }
              - { name: scaleMaxLabel, label: "[scale] Label for the high end", widget: string, required: false }
              - name: options
                label: "[single / multi / rankTwo] Answer options"
                widget: list
                required: false
                field: { name: option, label: Option, widget: string }
              - { name: maxSelections, label: "[multi] Max selections allowed (leave blank for unlimited)", widget: number, value_type: int, required: false }
              - { name: gridColumns, label: "[grid] Column headings", widget: list, required: false, field: { name: column, label: Column, widget: string } }
              - name: gridRows
                label: "[grid] Rows"
                widget: list
                required: false
                fields:
                  - { name: id, label: "Row id", widget: string }
                  - { name: label, label: "Row label", widget: string }
              - { name: gridFollowUpColumn, label: "[grid] Column that reveals the follow-up text field", widget: string, required: false }
              - { name: gridFollowUpPrompt, label: "[grid] Follow-up field prompt", widget: string, required: false }
              - { name: detailPrompt, label: "[single / multi] Optional free-text detail box prompt", widget: string, required: false }
              - { name: detailShowIfValues, label: "[single / multi] Only show the detail box for these answers (leave blank to always show once answered)", widget: list, required: false, field: { name: value, label: Value, widget: string } }
              - { name: showIfQuestionId, label: "Only show this question if another question's answer matches (id of that question)", widget: string, required: false }
              - { name: showIfValues, label: "...and its answer is one of these", widget: list, required: false, field: { name: value, label: Value, widget: string } }
      - name: closing
        label: "Closing contact step (optional - only reachable if the opt-in gate above is answered \"yes\")"
        widget: object
        required: false
        fields:
          - { name: leadText, label: "Lead copy", widget: text }
          - { name: consentNote, label: "Consent / privacy small print", widget: text }
          - { name: fields, label: "Fields to collect", widget: select, multiple: true, options: ["name", "organisation", "email"], default: ["name", "organisation", "email"] }
          - { name: offerMarketingConsent, label: "Also offer a separate \"contact me about your services\" marketing consent checkbox", widget: boolean, default: false }
          - { name: marketingLabel, label: "Marketing checkbox label (if offered above)", widget: string, required: false }

  - name: insights
    label: Insights
    folder: src/content/insights
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{published}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: published, label: "Published (uncheck to pull this off the live site)", widget: boolean, default: true }
      - { name: topic, label: Topic, widget: string }
      - { name: excerpt, label: Excerpt, widget: text }
      - { name: author, label: Author, widget: string }
      - { name: role, label: Role, widget: string }
      - { name: authorImg, label: "Author photo path", widget: string }
      - { name: read, label: "Read time", widget: string }
      - { name: date, label: "Date (long)", widget: string }
      - { name: dateShort, label: "Date (short)", widget: string }
      - { name: order, label: Order, widget: number, value_type: int }
      - { name: featured, label: Featured, widget: boolean, default: false }
      - { name: leadCaption, label: "Lead caption", widget: text }
      - { name: leadImage, label: "Lead image path (optional)", widget: string, required: false }
      - { name: body, label: Body, widget: markdown }
